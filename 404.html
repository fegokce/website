<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Endpoint Not Found | Ferhat Gökçe</title>
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline';" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0a0d14;
        --card: rgba(17, 23, 38, 0.85);
        --border: rgba(255, 255, 255, 0.08);
        --cyan: #38bdf8;
        --red: #f43f5e;
        --text: #f8fafc;
        --muted: #94a3b8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-image: radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.08) 0%, transparent 60%);
      }
      .error-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px;
        max-width: 580px;
        width: 100%;
        backdrop-filter: blur(12px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      .terminal-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }
      .dot { width: 12px; height: 12px; border-radius: 50%; }
      .dot-red { background: #ef4444; }
      .dot-yellow { background: #f59e0b; }
      .dot-green { background: #10b981; }
      .terminal-title {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        color: var(--muted);
        margin-left: 8px;
      }
      .error-code {
        font-size: clamp(3.5rem, 8vw, 5rem);
        font-weight: 800;
        line-height: 1;
        color: var(--red);
        font-family: "JetBrains Mono", monospace;
        margin-bottom: 8px;
      }
      h1 { font-size: 1.5rem; margin-bottom: 12px; }
      p { color: var(--muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; }
      .diag-box {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 18px;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.82rem;
        color: #38bdf8;
        margin-bottom: 28px;
      }
      .diag-line { display: flex; justify-content: space-between; margin-bottom: 4px; }
      .diag-line:last-child { margin-bottom: 0; }
      .diag-line span { color: var(--muted); }
      .actions { display: flex; gap: 12px; align-items: center; }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
        color: #fff;
        border: none;
      }
      .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(56, 189, 248, 0.4); }
      .countdown { font-size: 0.85rem; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="error-card">
      <div class="terminal-header">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
        <span class="terminal-title">middleware-gateway: error-handler</span>
      </div>

      <div class="error-code">404</div>
      <h1>Hedef Rota Bulunamadı</h1>
      <p>
        İstekte bulunduğunuz ağ kaynağı sunucu havuzunda tanımlı değil veya taşınmış.
      </p>

      <div class="diag-box">
        <div class="diag-line"><span>HTTP_STATUS:</span><strong>404 NOT_FOUND</strong></div>
        <div class="diag-line"><span>ROUTER:</span><strong>Middleware_Proxy_Cluster</strong></div>
        <div class="diag-line"><span>ACTION:</span><strong>Route to Index</strong></div>
      </div>

      <div class="actions">
        <a href="./" class="btn btn-primary">Ana Sayfaya Dön</a>
        <span class="countdown" id="timer"><b id="sec">8</b> saniye içinde yönlendiriliyorsunuz...</span>
      </div>
    </main>

    <script>
      let seconds = 8;
      const secEl = document.getElementById("sec");
      const countdown = setInterval(() => {
        seconds--;
        if (secEl) secEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(countdown);
          window.location.href = "./";
        }
      }, 1000);
    </script>
  </body>
</html>
